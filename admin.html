<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>티빙 운영자 콘솔 · 함께보기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .adm { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; display: flex; flex-direction: column; gap: 18px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .stat b { font-size: 28px; display: block; margin-top: 4px; }
    .adm h3 { margin-bottom: 12px; }
    .adm select { padding: 8px 10px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--line); }
    .prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .prow:last-child { border: 0; }
    @media (max-width: 800px) { .grid4 { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="adm">
    <div class="row sb"><div><span class="pill">운영자 콘솔</span><h2 style="margin-top:6px">함께보기 운영 관리</h2></div>
      <span class="small muted">UC-12 체험권·보상 정책 · UC-13 신고 처리 · UC-14 접속 현황·장애 대응</span></div>
    <div class="grid4" id="stats"></div>
    <div class="grid2">
      <div class="card" id="policy"></div>
      <div class="card" id="ops"></div>
    </div>
    <div class="card"><h3>방 현황</h3><div id="rooms"></div></div>
    <div class="card"><h3>신고 처리</h3><div id="reports"></div></div>
  </div>
  <div id="toasts" class="toasts"></div><div id="modal"></div>
  <script src="js/sim.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
